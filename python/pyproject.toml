[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "axint"
version = "0.6.0"
description = "Python SDK for Axint: define, validate, and generate inspectable Swift for App Intents, SwiftUI, WidgetKit, and app scaffolds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Axint contributors" },
]
keywords = [
    "apple",
    "app-intents",
    "siri",
    "shortcuts",
    "ai-agents",
    "mcp",
    "swift",
    "code-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28.1"]
registry = ["pyyaml>=6.0.3"]
all = ["mcp>=1.28.1", "pyyaml>=6.0.3"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pip-audit>=2.10.1",
    "pyyaml>=6.0.3",
    "types-PyYAML>=6.0.12.20260518",
]

[project.urls]
Homepage = "https://axint.ai"
Documentation = "https://github.com/agenticempire/axint/tree/main/python#readme"
Repository = "https://github.com/agenticempire/axint"
Issues = "https://github.com/agenticempire/axint/issues"
Changelog = "https://github.com/agenticempire/axint/blob/main/CHANGELOG.md"

[project.scripts]
axint-py = "axint.cli:main"
axint-mcp-py = "axint.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["axint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = "axint.mcp_server"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pyright]
include = ["axint"]
exclude = ["axint/mcp_server.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportReturnType = "error"
