name: Bug Report
description: Report a bug in Axint
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Define an intent with...
        2. Run `axint compile ...`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Axint Version
      description: Output of `axint --version`
      placeholder: "0.4.x"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Create app / starter
        - Compiler / IR
        - Validator
        - Swift repair rules
        - Fix Packet
        - Axint Run / Xcode proof
        - MCP Server
        - CLI
        - Cloud Check
        - Registry package
        - Telemetry / Feedback
        - Templates
        - Documentation
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context - OS, Node version, Xcode version, MCP host, `.axint/run/latest.md`, or source-free feedback packet ID.
