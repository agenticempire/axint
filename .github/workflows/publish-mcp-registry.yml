name: Publish MCP Registry

# Triggered after a release tag lands (npm publish has already happened) or
# manually via the Actions tab. The previous trigger was on every push to
# main that touched server.json, which raced against the manual `npm publish`
# step and produced a red X on main when the visibility check ran before npm
# had the new version.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Wait for package visibility
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function main() {
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const packages = server.packages || [];

            const registryPackages = packages
              .filter((pkg) => pkg.registryType === "npm" || pkg.registryType === "pypi")
              .map((pkg) => ({
                name: pkg.identifier,
                version: pkg.version,
                registryType: pkg.registryType,
              }));

            if (registryPackages.length === 0) {
              console.log("server.json does not declare npm or PyPI packages; skipping visibility wait.");
              return;
            }

            for (const pkg of registryPackages) {
              const url =
                pkg.registryType === "npm"
                  ? `https://registry.npmjs.org/${encodeURIComponent(pkg.name).replace(/^%40/, "@")}/${pkg.version}`
                  : `https://pypi.org/pypi/${encodeURIComponent(pkg.name)}/${pkg.version}/json`;
              let ok = false;

              // 30 attempts × 20s = 10-minute total budget. The previous 3-minute
              // window was too tight when CDN propagation was slow on either npm
              // or PyPI; bumping this is much cheaper than a manual rerun.
              const MAX_ATTEMPTS = 30;
              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
                const res = await fetch(url);
                if (res.ok) {
                  console.log(`${pkg.name}@${pkg.version} is visible on ${pkg.registryType}.`);
                  ok = true;
                  break;
                }

                console.log(
                  `${pkg.name}@${pkg.version} not visible on ${pkg.registryType} yet (${res.status}); retry ${attempt}/${MAX_ATTEMPTS}.`
                );
                await sleep(20_000);
              }

              if (!ok) {
                console.error(
                  `${pkg.name}@${pkg.version} was not visible on ${pkg.registryType} before MCP publish.`
                );
                process.exit(1);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          set -euo pipefail
          # Retry publish up to 8 times (≈ 8 min total) because mcp-publisher
          # does its own PyPI / npm lookup against an endpoint that often
          # lags behind the JSON APIs our pre-check uses. Without a retry
          # loop, registries that are still propagating return 404 inside
          # mcp-publisher even though we already saw them as visible.
          # 'duplicate version' is treated as success (idempotent reruns).
          MAX_ATTEMPTS=8
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if output=$(./mcp-publisher publish 2>&1); then
              echo "$output"
              exit 0
            fi

            echo "$output"

            if grep -qi "duplicate version" <<<"$output"; then
              echo "::notice::This server.json version is already published in the official MCP Registry."
              exit 0
            fi

            # Only retry on registry-propagation 404s. Anything else is a
            # real error we shouldn't keep hammering.
            if ! grep -qiE "not found.*404|status: 404" <<<"$output"; then
              exit 1
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::notice::Registry propagation 404 on attempt ${attempt}/${MAX_ATTEMPTS}; sleeping 60s and retrying."
              sleep 60
            fi
          done

          echo "::error::mcp-publisher kept seeing 404 after ${MAX_ATTEMPTS} attempts. The package was visible to our pre-check but the upstream MCP registry validator never caught up."
          exit 1
