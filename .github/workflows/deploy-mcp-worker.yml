name: Deploy MCP Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/mcp-http/**"
      - "src/core/**"
      - "src/mcp/manifest.ts"
      - "src/mcp/prompts.ts"
      - "src/templates/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-mcp-production.mjs"
      - ".github/workflows/deploy-mcp-worker.yml"

permissions:
  contents: read

concurrency:
  group: axint-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mcp-production
    steps:
      - uses: actions/checkout@v7

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is required for the mcp-production environment."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is required for the mcp-production environment."
            exit 1
          }

      - name: Install worker dependencies
        working-directory: workers/mcp-http
        run: npm ci

      - name: Validate worker bundle
        working-directory: workers/mcp-http
        run: |
          npm audit --audit-level=moderate
          npm run typecheck
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/axint-mcp-worker"

      - name: Deploy worker
        working-directory: workers/mcp-http
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production protocol surface
        run: node scripts/check-mcp-production.mjs
