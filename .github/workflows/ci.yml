name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── TypeScript Compiler ──────────────────────────────────────────
  test-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run versions:check
      - run: npm run metrics:check
      - run: npm run benchmark:brownfield:check
      - run: npm run docs:check
      - run: npm run boundary:check
      - run: npm run typecheck
      - run: npm run typecheck:examples
      - run: npm run lint
      - run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload TypeScript coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: typescript
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Run benchmarks
        run: npm run bench -- --reporter=verbose
        continue-on-error: true

      - name: Verify CLI works
        run: |
          set -euo pipefail
          OUTPUT=$(node dist/cli/index.js --version)
          [ -n "$OUTPUT" ] || exit 1
          echo "CLI version: $OUTPUT"

      - name: Publish Axint Cloud CI report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AXINT_CLOUD_REPORT_TOKEN: ${{ secrets.AXINT_CLOUD_REPORT_TOKEN }}
          AXINT_CLOUD_REPORT_URL: https://registry.axint.ai/api/v1/cloud/reports/ci
        run: |
          set -euo pipefail
          if [ -z "${AXINT_CLOUD_REPORT_TOKEN:-}" ]; then
            echo "AXINT_CLOUD_REPORT_TOKEN not set — skipping"
            exit 0
          fi
          npx tsx scripts/publish-cloud-report.ts

      - name: Verify publishable npm artifact
        run: npm run package:check

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} compatibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.node-version == 26 }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run versions:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:check
      - run: npx vitest run tests/core/compiler.test.ts tests/mcp/http-transport.test.ts tests/mcp/server.test.ts
      - run: npm run install:gauntlet

  typescript-next:
    name: TypeScript 7 compiler API canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - name: Install TypeScript 7 without changing the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps typescript@7.0.2
      - name: Inspect the TypeScript 7 compiler API surface
        id: compiler-api
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import ts from "typescript";

          const hasCompilerApi =
            typeof ts.createSourceFile === "function" &&
            typeof ts.createProgram === "function";

          console.log(`TypeScript ${ts.version}`);
          console.log(`compiler API available: ${hasCompilerApi}`);
          console.log(`sample exports: ${Object.keys(ts).slice(0, 30).join(", ")}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `available=${hasCompilerApi}\n`);
          NODE
      - name: Type-check and test against TypeScript 7
        if: steps.compiler-api.outputs.available == 'true'
        run: |
          npm run typecheck
          npx vitest run tests/core/parser.test.ts tests/core/compiler.test.ts
      - name: Record the upstream compiler API migration blocker
        if: steps.compiler-api.outputs.available != 'true'
        run: |
          {
            echo "### TypeScript 7 compiler API canary"
            echo
            echo "TypeScript 7.0.2 does not expose createSourceFile/createProgram from the package entry point."
            echo "Axint remains pinned to the supported TypeScript 6 line while the upstream compiler API migration path is evaluated."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::TypeScript 7.0.2 omits the compiler API from the public package entry point; supported TypeScript 6 checks remain required."

  mcp-v2-canary:
    name: MCP 2026-07-28 TypeScript client canary
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Test the hosted server with the split v2 beta client
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          npm init -y >/dev/null
          npm install @modelcontextprotocol/client@2.0.0-beta.4
          cp "$GITHUB_WORKSPACE/scripts/check-mcp-v2-canary.mjs" .
          node check-mcp-v2-canary.mjs

  # ── Swift Sandbox (macOS) ─────────────────────────────────────────
  test-swift-sandbox:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Run sandbox tests (requires Xcode + AppIntents SDK)
        run: npx vitest run tests/core/sandbox.test.ts --reporter=verbose

  xcode-27-canary:
    name: Xcode 27 beta compatibility canary
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Select Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::notice::The current macos-26 image does not include Xcode 27; skipping this canary until the image catches up."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version
      - if: steps.xcode.outputs.available == 'true'
        run: npm run build
      - if: steps.xcode.outputs.available == 'true'
        run: npx vitest run tests/core/sandbox.test.ts tests/apple --reporter=verbose
      - if: steps.xcode.outputs.available == 'true'
        run: npx tsx scripts/wwdc-diff.ts --snapshot

  # ── Python SDK ───────────────────────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          pip install -e '.[dev,mcp,registry]' build twine

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy axint

      - name: Type check with pyright
        run: pyright

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=axint --cov-report=json --cov-report=lcov --cov-report=term

      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./python/coverage.json
          flags: python
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Verify CLI works
        run: |
          set -euo pipefail
          axint-py --version
          axint-py parse examples/create_event.py --json

      - name: Verify publishable Python artifacts
        if: matrix.python-version == '3.14'
        run: |
          python -m build
          twine check dist/*

      - name: Check docs.axint.ai/python/install freshness
        if: matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: python scripts/check-docs-freshness.py

  python-next:
    name: Python 3.15 compatibility canary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          pip install -e '.[dev,mcp,registry]'
      - name: Verify the prerelease environment
        run: |
          python --version
          python -m pip check
      - run: pytest -v --tb=short

  python-mcp-v2-canary:
    name: MCP 2026-07-28 Python SDK canary
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: pip install --pre 'mcp>=2.0.0b2,<3'
      - run: pytest -v --tb=short tests/test_mcp_server.py
