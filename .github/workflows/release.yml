name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Bridge secrets to env so step `if:` conditions can gate on their presence.
      # `secrets` context isn't available in step-level `if` expressions.
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run versions:check
      - run: npm run mcp:registry:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run package:check
      - run: npm test
      - run: npm audit --audit-level=moderate

      - name: Verify CLI works
        run: |
          set -euo pipefail
          OUTPUT=$(node dist/cli/index.js --version)
          [ -n "$OUTPUT" ] || exit 1
          echo "CLI version: $OUTPUT"

      # ── Validate Python SDK before publishing anything ───────────
      # Keep every validation step above the first publish. A Python
      # test failure at this point aborts the run, so a broken SDK
      # can't ride along with a successful npm publish.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          pip install build twine pip-audit

      - name: Require PyPI token for coordinated releases
        if: env.HAS_PYPI_TOKEN != 'true'
        run: |
          echo "::error::PYPI_TOKEN is required so npm and PyPI stay aligned on intentional releases."
          exit 1

      - name: Verify coordinated release preflight
        run: |
          set -euo pipefail
          if npm run release:check; then
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const pyproject = readFileSync("python/pyproject.toml", "utf8");
          const pyVersion = pyproject.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const npmUrl = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`;
          const pypiUrl = `https://pypi.org/pypi/axint/${pyVersion}/json`;
          const [npmRes, pypiRes] = await Promise.all([fetch(npmUrl), fetch(pypiUrl)]);

          if (pkg.version === pyVersion && npmRes.ok && !pypiRes.ok) {
            console.log(`resuming coordinated release: ${pkg.name}@${pkg.version} is live; axint ${pyVersion} is still missing on PyPI`);
            process.exit(0);
          }

          console.error("release preflight failed and this is not a resumable npm-live/pypi-missing state");
          process.exit(1);
          NODE

      - name: Require a current hosted MCP server when automated deployment is unavailable
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true' || env.HAS_CLOUDFLARE_ACCOUNT_ID != 'true'
        run: npm run mcp:production:check

      - name: Run Python tests
        working-directory: python
        run: |
          set -euo pipefail
          pip install -e '.[dev,mcp,registry]'
          python -m pip_audit --local --skip-editable
          pytest -v

      - name: Build Python package
        working-directory: python
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test installed Python wheel
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv /tmp/axint-wheel-smoke
          /tmp/axint-wheel-smoke/bin/pip install dist/*.whl
          /tmp/axint-wheel-smoke/bin/axint-py --version

          set +e
          OUTPUT=$(/tmp/axint-wheel-smoke/bin/axint-mcp-py 2>&1)
          STATUS=$?
          set -e
          [ "$STATUS" -eq 1 ]
          echo "$OUTPUT" | grep -F "pip install 'axint[mcp]'"

      # ── Publish ──────────────────────────────────────────────────
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION already published, skipping"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Publish to PyPI
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/* --skip-existing

      - name: Verify coordinated release post-publish
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm run release:check -- --require-both-live; then
              exit 0
            fi
            echo "release parity is not visible yet; retrying after registry propagation ($attempt/5)"
            sleep 30
          done
          npm run release:check -- --require-both-live

      - name: Deploy hosted MCP server
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true' && env.HAS_CLOUDFLARE_ACCOUNT_ID == 'true'
        working-directory: workers/mcp-http
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/axint-mcp-worker"
          npx wrangler deploy

      - name: Verify hosted MCP release parity
        run: npm run mcp:production:check

      - name: Render release-specific notes
        if: github.event_name == 'push'
        run: npm run release:notes -- "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md
